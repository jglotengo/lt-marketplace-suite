name: Deploy LTMS to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ltms_ci
          chmod 600 ~/.ssh/ltms_ci
          ssh-keygen -y -f ~/.ssh/ltms_ci > /dev/null
          echo "SSH key OK"

      - name: Copy QA script to server via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          scp -i ~/.ssh/ltms_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/ltms-qa.php \
            "$SSH_USER@$SSH_HOST:/home/customer/www/lo-tengo.com.co/public_html/ltms-qa.php" \
            2>&1 || echo "SCP failed (non-critical)"
          scp -i ~/.ssh/ltms_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/ltms-fix-sellers-now.php \
            "$SSH_USER@$SSH_HOST:/home/customer/www/lo-tengo.com.co/public_html/ltms-fix-sellers-now.php" \
            2>&1 || echo "SCP fix-sellers failed (non-critical)"
          scp -i ~/.ssh/ltms_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -P "$SSH_PORT" \
            deploy/ltms-publish-legal-pages-2026-07-22.php \
            "$SSH_USER@$SSH_HOST:/home/customer/www/lo-tengo.com.co/public_html/wp-content/plugins/lt-marketplace-suite/deploy/ltms-publish-legal-pages-2026-07-22.php" \
            2>&1 || echo "SCP legal-pages failed (non-critical)"

      # DEPLOY-WH-CAPTCHA-2026-10-28: el webhook HTTP quedo inutilizable desde
      # los runners de GitHub porque SiteGround responde 202 + sgcaptcha (bot
      # protection) y el step viejo trataba 202 como exito: el deploy reportaba
      # verde sin desplegar nada. El deploy ahora va por SSH con la clave
      # dedicada del CI, usa el PAT de LTMS_GH_TOKEN solo como header de git
      # (sin persistirlo en .git/config) y FALLA si el SHA del servidor no
      # coincide con el commit pusheado.
      # DEPLOY-RELOAD-2026-10-29: el reload (migraciones + rewrite flush +
      # cache flush + sg purge) corre DENTRO del step SSH con timeout por
      # comando y log en /tmp/ltms-reload.log; si las migraciones fallan o la
      # home no responde 200, el step FALLA. El background (nohup/setsid) NO
      # sirve en SG: el proceso muere al cerrar la sesion SSH (log vacio).
      - name: Deploy via SSH (git ff-only + reload + SHA verification)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ltms_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "EXPECTED_SHA=$EXPECTED_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          PLUGIN=/home/customer/www/lo-tengo.com.co/public_html/wp-content/plugins/lt-marketplace-suite
          WP=/home/customer/www/lo-tengo.com.co/public_html
          GH_TOKEN=$(/usr/local/bin/wp eval 'echo defined("LTMS_GH_TOKEN") ? LTMS_GH_TOKEN : "";' --allow-root --path="$WP")
          if [ -z "$GH_TOKEN" ]; then
            echo "DEPLOY-FAILED: LTMS_GH_TOKEN no definido en wp-config"
            exit 1
          fi
          cd "$PLUGIN"
          git remote set-url origin https://github.com/jglotengo/lt-marketplace-suite.git
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          GIT_TERMINAL_PROMPT=0 git -c http.extraheader="Authorization: Basic $AUTH" fetch origin main --quiet
          git merge --ff-only origin/main
          DEPLOYED=$(git rev-parse HEAD)
          echo "deployed=$DEPLOYED expected=$EXPECTED_SHA"
          if [ "$DEPLOYED" != "$EXPECTED_SHA" ]; then
            echo "DEPLOY-FAILED: SHA mismatch (el servidor no recibio el commit pusheado)"
            exit 1
          fi
          find ~/.opcache -type f -delete 2>/dev/null || true
          find /tmp/php-opcache-* -type f -delete 2>/dev/null || true
          echo "OPCACHE-RESET-OK"
          cat > /tmp/ltms-reload.sh <<'EOS'
          #!/bin/bash
          WP=/home/customer/www/lo-tengo.com.co/public_html
          {
            echo "START $(date -u +%FT%TZ)"
            # Migraciones: activate() ya no se ejecuta en cada deploy (evita el
            # downtime del deactivate/activate). Si fallan, el deploy FALLA.
            timeout 120 /usr/local/bin/wp eval 'LTMS_DB_Migrations::run();' --allow-root --path="$WP" \
              || { echo "MIGRATIONS-FAILED"; exit 1; }
            timeout 60 /usr/local/bin/wp rewrite flush --allow-root --path="$WP" \
              || echo "REWRITE-FLUSH-FAILED (non-fatal)"
            timeout 120 /usr/local/bin/wp cache flush --allow-root --path="$WP" \
              || echo "CACHE-FLUSH-FAILED (non-fatal)"
            timeout 180 /usr/local/bin/wp sg purge --allow-root --path="$WP" \
              || echo "SG-PURGE-FAILED (non-fatal)"
            /usr/local/bin/wp eval 'echo "LTMS_VERSION=".LTMS_VERSION."\n";' --allow-root --path="$WP" || true
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://lo-tengo.com.co/)
            echo "home=$CODE"
            [ "$CODE" = "200" ] || { echo "HOME-NOT-200"; exit 1; }
            echo "DONE $(date -u +%FT%TZ)"
          } >> /tmp/ltms-reload.log 2>&1
          EOS
          chmod +x /tmp/ltms-reload.sh
          : > /tmp/ltms-reload.log
          RC=0
          timeout 400 /tmp/ltms-reload.sh || RC=$?
          cat /tmp/ltms-reload.log
          exit $RC
          REMOTE

      - name: Verify production responds
        run: |
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://lo-tengo.com.co/)
            echo "home=$CODE (intento $i)"
            [ "$CODE" = "200" ] && exit 0
            sleep 5
          done
          exit 1
